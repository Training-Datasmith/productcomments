services:
  _defaults:
    public: true

  product_comment_criterion_repository:
    class: Presta_Shop\Module\Product_Comment\Repository\Product_Comment_Criterion_Repository
    arguments:
      - '@doctrine'
      - '@doctrine.dbal.default_connection'
      - '%database_prefix%'

  product_comment_repository:
    class: Presta_Shop\Module\Product_Comment\Repository\Product_Comment_Repository
    arguments:
      - '@doctrine'
      - '@doctrine.dbal.default_connection'
      - '%database_prefix%'
      - '@=service("prestashop.adapter.legacy.configuration").get("PRODUCT_COMMENTS_ALLOW_GUESTS")'
      - '@=service("prestashop.adapter.legacy.configuration").get("PRODUCT_COMMENTS_MINIMAL_TIME")'
